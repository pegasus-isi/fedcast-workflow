# Cross-silo placement map for fedcast-workflow (used with --silos).
#
# Each federated client (radar site) is pinned to the machine that holds
# its data. Client training and per-client validation run ONLY there; the
# shard is written once by that client's preprocess job and read in place
# every round: the federated arm never moves a shard, returning only model
# weights and small per-client counts and losses. The centralized baseline
# and MCT evaluation do need all shards pooled, so each is copied out once
# by a pinned silo_export job, and the split manifest is staged out as a
# reproduction artifact. README.md's "Data placement" section lists
# everything that leaves a silo.
#
# The workflow itself knows nothing about schedulers. Its pinned jobs carry
# a Pegasus tag per silo (silo_KTLX for CPU work, silo_KTLX_gpu for GPU
# work), and custom_sites.py turns THIS file into the site-catalog entries
# that give those tags a meaning on your pool:
#
#   HTCondor  (--style condor)  condor.requirements = (Machine == "...")
#   Slurm     (--style slurm)   pegasus.glite.arguments = --nodelist=...
#
# The defaults below need NO configuration on the workers at all:
#   - pinning by `machine:` uses a name the scheduler already knows, so
#     nothing has to be advertised;
#   - a home-relative data_dir is inside Apptainer's default mounts, so no
#     bind is needed and the preprocess job creates the directory itself.
# Copy this file, put your own machine names in, and run
#   custom_sites.py --style <condor|slurm> --silos silos.yml
#   tools/silo_check.py --style <condor|slurm> silos.yml
# to write the tags and confirm the pool matches.

# Where a shard lives on its silo machine.
#
# A home-relative path needs no worker setup: Apptainer mounts the job
# user's home by default, so nothing is bind-mounted and the preprocess job
# creates its own directory. It does assume every job on a machine runs as
# the same user — an HTCondor pool configured with per-slot users would
# resolve it differently for the preprocess and training jobs.
# `tools/silo_check.py` checks that on HTCondor and says so.
#
# On a cluster whose home is a shared filesystem (the usual Slurm layout),
# every node sees the shard, so pinning changes where the job runs, not
# what it can read. Point data_dir at node-local storage if the point of
# the run is that a shard is only readable at its holder.
#
# An absolute path is the answer when the same-user assumption does not
# hold, or when shards belong somewhere administered rather than in a job
# user's home. It is bind-mounted into the containers pool-wide, so EVERY
# machine must have the directory (`sudo tools/silo_worker_setup.sh none
# <dir>` on HTCondor workers; mkdir on Slurm nodes) — Apptainer refuses to
# start when a bind source is missing.
#
# Do NOT use /tmp or /var/tmp. HTCondor defaults MOUNT_UNDER_SCRATCH to
# "/tmp,/var/tmp" and Slurm sites commonly enable job_container/tmpfs,
# either of which makes them private to each job and deletes them when
# the job ends, so the shard would be gone before the next round.
data_dir: ~/.fedcast/silos

# Each silo pins in one of three ways (first match wins):
#   {machine: "<name>"}      the machine's name as the scheduler knows it:
#                            `condor_status -af Machine` on HTCondor,
#                            `sinfo -N` on Slurm. Works on both. No setup.
#   {requirements: "<expr>"} HTCondor only: raw ClassAd expression (escape
#                            hatch, e.g. to let a silo match any of several
#                            machines). custom_sites.py rejects it for Slurm.
#   {}                       HTCondor only: the worker advertises this silo
#                            in the string-list ClassAd named by `attribute`
#                            below, which `tools/silo_worker_setup.sh
#                            KTLX,KVNX` configures. Useful when you would
#                            rather not hardcode hostnames.
#
# Several silos may share one machine — that is how seven clients fit a
# pool with fewer than seven GPU nodes; each still reads only its own
# shard. A silo must resolve to exactly ONE machine: the preprocess job
# writes the shard to one machine and nothing replicates it, so a training
# job that matched a second machine would find nothing. tools/silo_check.py
# fails on a silo matching more than one machine (override with
# --allow-multi-worker-silo only if you replicate data_dir yourself).

attribute: FEDCAST_SILOS

silos:
  KTLX: {machine: "worker-1.example.org"}
  KVNX: {machine: "worker-1.example.org"}
  KBYX: {machine: "worker-2.example.org"}
  KLGX: {machine: "worker-2.example.org"}
  KENX: {machine: "worker-3.example.org"}
  KBOX: {machine: "worker-3.example.org"}
  PAHG: {machine: "worker-4.example.org"}
